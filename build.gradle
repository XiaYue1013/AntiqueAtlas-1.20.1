plugins {
	id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
    id "me.modmuss50.mod-publish-plugin" version "0.7.4"
	id "com.modrinth.minotaur" version "2.+"
}
apply from: "main.gradle"
apply plugin: 'net.minecraftforge.gradle'
// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'org.spongepowered.mixin'

// Should exist on all loaders and is loader specific
repositories {
    mavenCentral()
    maven { url 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei' } }
	maven {
        url "https://modmaven.dev/"
        content { includeGroup 'com.stereowalker.unionlib' }
    }
	maven { url "https://girafi.dk/maven/"; content { includeGroupByRegex 'dk\\.girafi.*' } }
	maven { url "https://www.cursemaven.com"; content { includeGroup 'curse.maven' } }
    maven { url = "https://repo.spongepowered.org/maven"; content { includeGroup 'org.spongepowered' } }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

if (project.hasProperty('bugfixMissingDependency')) {
    configurations.runtimeClasspath.exclude group: 'com.stereowalker.unionlib'
}

dependencies {
	minecraft "net.minecraftforge:forge:${_minecraft_version}-" + _loader_version
    testCompileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.20.0.112')
    if (project.hasProperty('bugfixClientTest')) {
        runtimeOnly fg.deobf('mezz.jei:jei-1.20.1-forge:15.20.0.112')
    }
	annotationProcessor "org.spongepowered:mixin:"+modMixinVersion+":processor"
	implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
	
	implementation fg.deobf("com.stereowalker.unionlib:UnionLib:${_minecraft_version}-${_unionlib_version}-${_loader}") {
        exclude group: "net.minecraftforge", module: "forge"
    }
    minecraftLibrary ("org.tomlj:tomlj:1.0.0") {
    	exclude group: 'com.google.code.findbugs', module: 'jsr305'
    }
    // UnionLib's TOML reader is also needed in an installed Forge instance.
    // Forge already supplies ANTLR 4.9.1; do not bundle a conflicting runtime.
    jarJar('org.tomlj:tomlj:[1.0.0,1.0.1)') { transitive = false }
}

// These aren't loader specific and should exist on all loaders
